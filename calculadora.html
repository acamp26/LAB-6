<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #333;
        }
        .menu-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        button, .btn {
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn:hover {
            background: #45a049;
        }
        .op-container {
            background: white;
            width: 350px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #resultado {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        .hidden {
            display: none;
        }
        .back-btn {
            background: #2196F3;
            margin-top: 20px;
        }
        .back-btn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <!-- MENÚ PRINCIPAL -->
    <div id="menu">
        <h1>Calculadora</h1>
        <p>Seleccione una operación:</p>
        <div class="menu-container">
            <button onclick="mostrarOperacion('suma')">➕ Suma</button>
            <button onclick="mostrarOperacion('resta')">➖ Resta</button>
            <button onclick="mostrarOperacion('multiplicacion')">✖ Multiplicación</button>
            <button onclick="mostrarOperacion('division')">➗ División</button>
            <button onclick="mostrarOperacion('potencia')">⚡ Potencia</button>
        </div>
    </div>

    <!-- CONTENEDOR DE OPERACIONES -->
    <div id="operacion-section" class="hidden">
        <h1 id="titulo-operacion"></h1>
        <div class="op-container">
            <input type="number" id="num1" placeholder="Ingrese el primer número">
            <input type="number" id="num2" placeholder="Ingrese el segundo número">
            <button id="btn-calcular">Calcular</button>
            <p id="resultado">Resultado:</p>
        </div>
        <button class="back-btn" onclick="volverMenu()">⬅ Volver al menú</button>
    </div>

    <script>
        let operacionActual = '';

        function mostrarOperacion(operacion) {
            operacionActual = operacion;
            
            // Ocultar menú y mostrar sección de operación
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('operacion-section').classList.remove('hidden');
            
            // Cambiar título según operación
            const titulos = {
                'suma': 'Operación: Suma',
                'resta': 'Operación: Resta',
                'multiplicacion': 'Operación: Multiplicación',
                'division': 'Operación: División',
                'potencia': 'Operación: Potencia'
            };
            
            document.getElementById('titulo-operacion').textContent = titulos[operacion];
            document.getElementById('resultado').textContent = 'Resultado:';
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
        }

        function volverMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('operacion-section').classList.add('hidden');
        }

        function calcular() {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);
            const resultado = document.getElementById("resultado");
            
            if (isNaN(num1) || isNaN(num2)) {
                resultado.textContent = "Ingrese valores numéricos válidos.";
                return;
            }
            
            let valor = 0;
            
            switch(operacionActual) {
                case "suma":
                    valor = num1 + num2;
                    break;
                case "resta":
                    valor = num1 - num2;
                    break;
                case "multiplicacion":
                    valor = num1 * num2;
                    break;
                case "division":
                    if (num2 === 0) {
                        resultado.textContent = "Error: división por cero";
                        return;
                    }
                    valor = num1 / num2;
                    break;
                case "potencia":
                    valor = Math.pow(num1, num2);
                    break;
            }
            
            resultado.textContent = "Resultado: " + valor;
        }

        // Agregar evento al botón calcular
        document.getElementById('btn-calcular').addEventListener('click', calcular);

        // Permitir calcular con Enter
        document.getElementById('num2').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calcular();
            }
        });
    </script>
</body>
</html>
